<section dir="rtl" class="bg-[#F9FAFC] py-12 flex flex-col items-center justify-center text-center">
  <h2 class="text-[18px] md:text-[20px] font-semibold text-gray-800 mb-6">
    اختر وسيلة لاستلام حجوزاتك وأحدث العروض :
  </h2>

  <div class="flex flex-wrap justify-center gap-4">

     <button
      (click)="openModal('email')"
      class="flex items-center gap-2 border border-[#0E74F0] text-[#0E74F0] font-semibold text-[14px] px-6 py-3 rounded-lg hover:bg-[#0E74F0] hover:text-white transition-all">
      <i class="fa-solid fa-envelope text-[18px] text-[#f45c42]"></i>
      التسجيل عبر الإيميل
    </button>
    <button
      (click)="openModal('whatsapp')"
      class="flex items-center gap-2 bg-[#25D366] text-white font-semibold text-[14px] px-6 py-3 rounded-lg shadow-md hover:bg-[#20ba5a] transition-all">
      <i class="fa-brands fa-whatsapp text-[18px]"></i>
      التسجيل عبر الواتساب
    </button>

   
  </div>

  <app-register-modal
    [type]="modalType"
    [isOpen]="modalType !== null"
    (close)="closeModal()">
  </app-register-modal>
</section>
