<section class="py-16 bg-[#f8f9ff] text-center relative overflow-hidden">
  <h2 class="text-3xl font-bold mb-12 text-black">استكشف العالم معنا</h2>

  <div class="perspective">
    <div 
      *ngFor="let img of images; let i = index"
      class="destination-card"
      (click)="setActive(i)"
      [ngClass]="getCardClass(i)"
    >
      <img [src]="img" alt="destination" />
    </div>
  </div>
</section>
