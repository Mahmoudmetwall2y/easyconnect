<app-loading-screen *ngIf="loading"></app-loading-screen>
<div *ngIf="!loading">
<section dir="rtl"
  class="relative w-full flex justify-center px-3 sm:px-6 lg:px-6 xl:px-0 -top-[50px] z-[40]">

  <div
    class="w-full max-w-[1320px] bg-white rounded-xl shadow-xl px-4 sm:px-6 py-5
           flex flex-col gap-4 border-t border-gray-100">



    <!--  Trip Type Dropdown -->
 <div class="relative w-full sm:w-auto">
  <button (click)="openDropdown = !openDropdown"
          class="flex items-center justify-between gap-2 bg-[#0E74F0] text-white
                 text-[14px] font-semibold px-5 py-2.5 rounded-md shadow-sm
                 w-full sm:w-[160px]">
    <span>{{ selectedTripType }}</span>
    <i class="fa-solid fa-chevron-down text-[12px]"></i>
  </button>

  <div *ngIf="openDropdown"
       class="absolute right-0 mt-2 w-[160px] bg-white rounded-md shadow-lg border border-gray-100 z-[99999]">
    <ul class="py-1">
      <li class="px-4 py-2 hover:bg-blue-50 cursor-pointer"
          (click)="selectTripType('ذهاب وعودة')">ذهاب وعودة</li>
      <li class="px-4 py-2 hover:bg-blue-50 cursor-pointer"
          (click)="selectTripType('ذهاب فقط')">ذهاب فقط</li>
    </ul>
  </div>
</div>


    <!--  Search Inputs (FROM - TO - DATES - PASSENGERS) -->
<div
  class="flex flex-col md:flex-row md:flex-wrap  xl:flex-row xl:flex-nowrap  lg:flex-row lg:flex-wrap
   2xl:flex-row 2xl:flex-nowrap
         items-center justify-between gap-3 w-full bg-white p-4 rounded-xl"
>

 <div class="flex flex-col md:flex-row items-center gap-3 w-full md:w-[48%] lg:w-auto">
<div class="flex flex-col w-full md:w-[200px]">
  <app-location-selector
    class="flex items-center rounded-lg w-full cursor-pointer"
    type="from"
    [initialValue]="selectedFrom"
    (locationSelected)="selectedFrom = $event">
  </app-location-selector>

  <p *ngIf="errorFrom" class="text-red-500 text-xs mt-1">
    من فضلك اختر بلد المغادرة
  </p>
</div>



<div class="flex flex-col w-full md:w-[200px]">
  <app-location-selector
    class="flex items-center rounded-lg w-full cursor-pointer"
    type="to"
    [initialValue]="selectedTo"
    (locationSelected)="selectedTo = $event">
  </app-location-selector>

  <p *ngIf="errorTo" class="text-red-500 text-xs mt-1">
    من فضلك اختر بلد الوصول
  </p>
</div>


     </div>
    

      <!-- التاريخ -->
 <div class="flex flex-col md:flex-row items-center gap-3 w-full md:w-[48%] lg:w-auto">

  <!-- تاريخ المغادرة -->
  <div class="flex items-center border rounded-lg px-3 py-2
              w-full md:w-[200px] relative cursor-pointer"
       (click)="openDepartureCal()">

    <i class="fa-solid fa-calendar absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>

    <div class="flex flex-col w-full pr-5">
      <label class="text-[13px] text-gray-400">تاريخ المغادرة</label>
      <input type="text" readonly [value]="selectedDeparture || ''"
             placeholder="اختر تاريخ المغادرة"
             class="text-[12px] font-semibold focus:outline-none text-gray-800"/>
             <p *ngIf="errorDep" class="text-red-500 text-xs mt-1">من فضلك اختر تاريخ المغادرة</p>

    </div>

    @if(showDepartureCal){
      <div class="absolute top-[110%] right-0 z-[99999] bg-white shadow-xl rounded-xl p-5">
        <app-flight-calendar
          [tripType]="selectedTripType"
          [initialDeparture]="depDate"
          [initialReturn]="retDate"
          (datePicked)="onDeparturePicked($event)">
        </app-flight-calendar>
      </div>
    }
  </div>

  <!-- تاريخ العودة -->
  <div *ngIf="selectedTripType === 'ذهاب وعودة'"
       class="flex items-center border rounded-lg px-3 py-2
              w-full md:w-[200px] relative cursor-pointer"
       (click)="openReturnCal()">

    <i class="fa-solid fa-calendar absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>

    <div class="flex flex-col w-full pr-5">
      <label class="text-[13px] text-gray-400">تاريخ العودة</label>
      <input type="text" readonly [value]="selectedReturn || ''"
             placeholder="اختر تاريخ العودة"
             class="text-[12px] font-semibold focus:outline-none text-gray-800"/>
             <p *ngIf="errorRet" class="text-red-500 text-xs mt-1">من فضلك اختر تاريخ العودة</p>

    </div>

    @if(showReturnCal){
      <div class="absolute top-[110%] right-0 z-[99999] bg-white shadow-xl rounded-xl p-5">
        <app-flight-calendar
          [tripType]="selectedTripType"
          [initialDeparture]="depDate"
          [initialReturn]="retDate"
          (datePicked)="onReturnPicked($event)">
        </app-flight-calendar>
      </div>
    }
  </div>

</div>


      <!-- المسافرين -->
 <app-passenger-selector
  class="w-full md:w-[48%] lg:w-auto"
  [initialAdults]="adults"
  [initialChildren]="children"
  [initialInfants]="infants"
  [initialClass]="travelClass"
  [initialSummary]="passengersSummary"
  (confirmed)="onPassengersConfirmed($event)">
</app-passenger-selector>

<button (click)="searchFlights()"
  class="bg-[#0E74F0] text-white text-[14px] font-semibold 
         px-6 py-3 rounded-lg hover:bg-blue-600 transition 
         flex items-center gap-2
         w-full md:w-auto
         justify-center whitespace-nowrap">
  <i class="fa-solid fa-magnifying-glass text-[15px]"></i>
  البحث عن الرحلات
</button>




    </div> 
    <!-- END Search Inputs -->

<div class="w-full flex flex-col sm:flex-row items-center gap-4 px-2 mt-1">

      <!-- رحلات مباشرة -->
      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input 
          type="checkbox" 
          [(ngModel)]="directOnly"
          class="w-4 h-4 rounded border-gray-300 cursor-pointer"
        />
        <span class="text-[14px] text-gray-700 font-medium">رحلات مباشرة فقط</span>
      </label>

      <!-- امتعة السفر -->
      <label class="flex items-center gap-2 cursor-pointer select-none">
        <input 
          type="checkbox" 
          [(ngModel)]="includeBaggage"
          class="w-4 h-4 rounded border-gray-300 cursor-pointer"
        />
        <span class="text-[14px] text-gray-700 font-medium">شاملة امتعة السفر</span>
      </label>

    </div>

  
  </div>

</section>

</div>
