<nav
  class="fixed top-2 left-1/2 transform -translate-x-1/2 w-[100%] max-w-[1500px] h-[68px] rounded-xl z-50 shadow-md"
  style="background: linear-gradient(90deg, #71acf3 0%, #4d8ad5 100%);">
  
  <div class="flex justify-between items-center h-full px-8">

    <!-- Logo -->
    <div class="flex items-center gap-2">
      <img src="assets/logo.png" alt="Logo" class="h-20 w-auto" />
    </div>

    <!-- Right Section -->
    <div class="flex items-center gap-5">

      <!-- تطبيق -->
      <button
        class="flex items-center gap-2 text-white hover:text-gray-200 transition text-[15px] font-medium">
        <!-- أيقونة الهاتف -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor" class="w-7 h-7">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.75 2.75h4.5a2 2 0 012 2v14.5a2 2 0 01-2 2h-4.5a2 2 0 01-2-2V4.75a2 2 0 012-2zM9 18.25h6" />
        </svg>
        <span class="text-lg">التطبيق</span>
      </button>

      <!-- العملة -->
      <div class="flex items-center gap-2 cursor-pointer">
        <img src="assets/flags/kw.png" alt="KWD" class="w-6 h-4 rounded-sm" />
        <span class="font-semibold text-white text-[15px]">KWD</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white"
          fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </div>

      <!-- الترجمة (صورة translate.png داخل دائرة بيضاء) -->
      <button
        class="flex items-center justify-center w-11 h-11  transition"
        (click)="toggleLang()">
        <img src="assets/translate.png" alt="Translate" class="w-5 h-5" />
      </button>

      <!-- المستخدم -->
      <div class="relative group">
        <button
          class="flex items-center gap-2 bg-white text-gray-800 px-3 py-1 rounded-md font-semibold">
          Ahmed
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- القائمة المنسدلة -->
        <div
          class="absolute right-0 hidden group-hover:block bg-white text-gray-700 mt-2 rounded-md shadow-lg w-40 py-2">
          <a routerLink="/profile" class="block px-4 py-2 hover:bg-gray-100">الملف الشخصي</a>
          <a routerLink="/bookings" class="block px-4 py-2 hover:bg-gray-100">حجوزاتي</a>
          <a (click)="logout()" class="block px-4 py-2 hover:bg-gray-100 text-red-600 cursor-pointer">
            تسجيل الخروج
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
