<nav
  class="fixed top-2 left-1/2 transform -translate-x-1/2 w-[100%] max-w-[1500px] h-[68px] rounded-xl z-[99999] relative shadow-md"
  style="background: linear-gradient(90deg, #71acf3 0%, #4d8ad5 100%);">
  
  <div class="flex justify-between items-center h-full px-8">

    <!-- Logo -->
    <div class="flex items-center gap-2">
      <img src="assets/logo.png" alt="Logo" class="h-20 w-auto" />
    </div>

    <!-- Right Section -->
    <div class="flex items-center gap-5">

      <!-- تطبيق -->
      <button
        class="flex items-center gap-2 text-white hover:text-gray-200 transition text-[15px] font-medium">
        <!-- أيقونة الهاتف -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor" class="w-7 h-7">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9.75 2.75h4.5a2 2 0 012 2v14.5a2 2 0 01-2 2h-4.5a2 2 0 01-2-2V4.75a2 2 0 012-2zM9 18.25h6" />
        </svg>
        <span class="text-lg">التطبيق</span>
      </button>

<!-- العملة -->
<div class="currency-selector relative z-[99999]">

  <!-- الزر -->
  <div 
    class="flex items-center gap-2 cursor-pointer"
    (click)="toggleCurrency()"
  >
    <img [src]="selectedCurrency.flag" class="w-4 h-4 rounded-sm" />
    <span class="font-semibold text-white text-[15px]">
      {{ selectedCurrency.iso }}
    </span>

    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white"
      fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </div>

  <!-- القائمة المنسدلة -->
  <div
    *ngIf="openCurrency"
    class="absolute right-0 mt-3 w-[360px] bg-white rounded-2xl shadow-xl z-[z-[999999]]" dir="rtl"
  >

    <div class="py-4 text-center text-xl font-bold text-gray-700 border-b">
      العملة
    </div>

    <div class="max-h-[380px] overflow-y-auto p-4 space-y-4">

      <div
        *ngFor="let c of currencies"
        (click)="setCurrency(c)"
        class="flex items-center justify-between bg-[#f6f6f6] hover:bg-[#e9e9e9] cursor-pointer py-1 px-2 rounded-xl"
      >

        <!-- العلم + كود -->
        <div class="flex items-center gap-3">
          <img [src]="c.flag" class="w-5 h-3 rounded-sm" />
          <span class="text-[17px] font-bold text-gray-800">
            {{ c.iso }}
          </span>
             <!-- الاسم العربي -->
        <span class="text-[17px] font-semibold text-gray-700">
          {{ currencyArabic[c.iso] }}
        </span>
        </div>

     

      </div>

    </div>
  </div>
</div>


      <!-- الترجمة (صورة translate.png داخل دائرة بيضاء) -->
      <button
        class="flex items-center justify-center w-11 h-11  transition"
        (click)="toggleLang()"
        >
        <img src="assets/translate.png" alt="Translate" class="w-5 h-5" />
      </button>

   <!-- لو مش عامل Login -->
<button
 *ngIf="!isLoggedIn()"
  (click)="goToLogin()"
  class="flex items-center justify-center w-11 h-11 rounded-full bg-white/20 hover:bg-white/30 transition"
>
  <svg xmlns="http://www.w3.org/2000/svg"
       class="w-7 h-7 text-white"
       fill="none"
       viewBox="0 0 24 24"
       stroke="currentColor"
       stroke-width="1.8">
    <circle cx="12" cy="12" r="10" />
    <path stroke-linecap="round" stroke-linejoin="round"
      d="M15.5 17a5.5 5.5 0 00-7 0M12 7.5a3 3 0 110 6 3 3 0 010-6z" />
  </svg>
</button>


<button
  *ngIf="isLoggedIn()"
  (click)="goToAccount()"
  class="flex items-center gap-2 bg-white text-gray-800 px-3 py-1 rounded-md font-semibold"
>
  {{ user()?.fullName }}
</button>


    </div>
  </div>
</nav>
