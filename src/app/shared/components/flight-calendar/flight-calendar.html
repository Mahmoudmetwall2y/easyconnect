<div dir="rtl" class="flex gap-6 bg-white rounded-2xl shadow-xl p-6 w-[620px]">
  <!-- الشهر الحالي -->
  <div class="flex flex-col items-center w-1/2">
    <div class="flex justify-between items-center w-full mb-4">
      <button (click)="prevMonth()" class="text-gray-400 hover:text-[#0E74F0] text-lg font-bold">&lt;</button>
      <span class="font-semibold text-gray-800 text-[15px]">
        {{ months[currentMonth] }} {{ currentYear }}
      </span>
      <div class="w-5"></div>
    </div>

    <!-- أسماء الأيام -->
    <div class="grid grid-cols-7 gap-2 text-center text-gray-500 font-medium text-[13px] mb-1">
   <div *ngFor="let d of weekDays"
     [ngClass]="{ 'weekend-friday': d === 'الجمعة' }">
  {{ d }}
</div>


    </div>

    <!-- الأيام -->
    <div class="grid grid-cols-7 gap-2 w-full">
     <div
  *ngFor="let day of currentMonthDays"
  (click)="selectDate(day.fullDate)"
  [ngClass]="getDayClass(day)"
class="relative flex items-center justify-center text-[13px] font-semibold cursor-pointer transition-all duration-150"
>

  <span>{{ day.day }}</span>

  <!-- المغادرة -->
  <div *ngIf="day.isDeparture" class="departure-label">
    <i class="fa-solid fa-plane text-[12px] rotate-[-45deg]"></i>
    المغادرة
  </div>

  <!-- العودة -->
  <div *ngIf="day.isReturn" class="return-label">
    <i class="fa-solid fa-plane text-[12px] rotate-[135deg]"></i>
    العودة
  </div>

</div>

    </div>
  </div>

  <!-- الشهر القادم -->
  <div class="flex flex-col items-center w-1/2">
    <div class="flex justify-between items-center w-full mb-4">
      <div class="w-5"></div>
      <span class="font-semibold text-gray-800 text-[15px]">
        {{ months[nextMonth] }} {{ nextYear }}
      </span>
      <button (click)="nextMonthFunc()" class="text-gray-400 hover:text-[#0E74F0] text-lg font-bold">&gt;</button>
    </div>

    <div class="grid grid-cols-7 gap-2 text-center text-gray-500 font-medium text-[13px] mb-1">
      <div *ngFor="let d of weekDays"
        [ngClass]="{ 'text-red-500 font-bold': d === 'الجمعة' }">{{ d }}</div>
    </div>

    <div class="grid grid-cols-7 gap-2 w-full">
    <div
  *ngFor="let day of nextMonthDays"
  (click)="selectDate(day.fullDate)"
  [ngClass]="getDayClass(day)"
  class="relative flex items-center justify-center text-[13px] font-semibold w-8 h-8 rounded-lg cursor-pointer transition-all duration-150">

  <span>{{ day.day }}</span>

  <div *ngIf="day.isDeparture" class="departure-label">
    <i class="fa-solid fa-plane text-[12px] rotate-[-45deg]"></i>
    المغادرة
  </div>

  <div *ngIf="day.isReturn" class="return-label">
    <i class="fa-solid fa-plane text-[12px] rotate-[135deg]"></i>
    العودة
  </div>
</div>

    </div>
  </div>
</div>
